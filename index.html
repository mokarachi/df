

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sindh Weather Forecast Table</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f6f9; }
  h2, h4 { color: #333; margin-bottom: 5px; }
  
  /* Input Section */
  .control-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
  #synopBox { width: 100%; height: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; font-size: 13px; box-sizing: border-box; }
  
  button { margin-top: 10px; padding: 10px 25px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; transition: background 0.3s; }
  button:hover { background-color: #0056b3; }
  button:disabled { background-color: #ccc; cursor: not-allowed; }
  
  #statusMsg { margin-left: 15px; font-weight: 600; color: #555; display: inline-block; }

  /* Table Styling */
  .table-container { overflow-x: auto; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1000px; }
  
  th, td { padding: 10px 8px; text-align: center; border-bottom: 1px solid #ddd; border-right: 1px solid #eee; }
  th { background-color: #2c3e50; color: white; font-weight: 600; vertical-align: middle; }
  
  /* Alternate row colors */
  tr:nth-child(even) { background-color: #f8f9fa; }
  tr:hover { background-color: #e2e6ea; }

  /* Specific Column Styling */
  td:first-child { text-align: left; font-weight: bold; color: #2c3e50; } /* Station Name */
  
  /* Obs Columns Highlight */
  .col-obs { background-color: #fff3cd !important; color: #856404; font-weight: bold; } /* Yellowish for Observed */
  tr:nth-child(even) .col-obs { background-color: #ffeeba !important; }
  
  /* Header grouping colors */
  th.group-temp { background-color: #e74c3c; } /* Red for Temp */
  th.group-rh { background-color: #3498db; }   /* Blue for RH */
</style>

 <script>
    function openLink(url) {
      window.open(url, "_blank"); // Opens link in a new tab
    }
  </script>
  <button onclick="openLink('https://pmdnmcc.net/websites/DownloadNMCCData.aspx')">DownLoad NMCC DATA</button>
  <button onclick="openLink('https://mokarachi.github.io/surface/')">Extract Surface Data</button>
  <button onclick="openLink('https://mokarachi.github.io/temps/')">Extract Temps Data</button>
  <button onclick="openLink('https://mokarachi.github.io/ptv/')">PTV Report</button>
  <button onclick="openLink('https://mokarachi.github.io/fc/')">Forecast</button>
  <button onclick="openLink('https://mokarachi.github.io/spd/')">SPD</button>
  <button onclick="openLink('https://mokarachi.github.io/pnship/')">PNShip</button>
  <button onclick="openLink('https://mokarachi.github.io/coastalbelt/')">Coastal Belt</button>
  <button onclick="openLink('https://mokarachi.github.io/sigmet/')">SIGMET</button>








</head>
<body>

<div class="control-panel">
  <h2>Sindh Weather Forecast Table</h2>
  <h4>Paste Yesterday's Synop Data (Section 333):</h4>
  <textarea id="synopBox" placeholder="Example: 41780 333 10355 20255 ... RH50%"></textarea>
  <br>
  <button id="loadBtn" onclick="processSynopAndLoad()">Load Table</button>
  <div id="statusMsg"></div>
</div>

<div class="table-container">
  <table id="weatherTable">
    <thead>
      <tr>
        <th rowspan="2" style="width:150px;">Station Name</th>
        <th rowspan="2">Code</th>
        <th class="group-temp" colspan="4">Temperature (°C)</th>
        <th class="group-rh" colspan="4">Relative Humidity (%)</th>
      </tr>
      <tr>
        <!-- Temp Subheaders -->
        <th class="col-obs" style="color:#856404; background:#fff3cd;">Today (Obs)</th>
        <th>Next 24h</th>
        <th>Next 48h</th>
        <th>Next 72h</th>
        <!-- RH Subheaders -->
        <th class="col-obs" style="color:#856404; background:#fff3cd;">Today (Obs)</th>
        <th>Next 24h</th>
        <th>Next 48h</th>
        <th>Next 72h</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="10" style="text-align:center; padding: 20px;">Waiting for data...</td></tr>
    </tbody>
  </table>
</div>

<script>
// --- Point Coordinates ---
const points = [
  { code: "41780", name: "Karachi", lat: 24.90232, lon: 67.1389922 },
  { code: "41783", name: "Thatta", lat: 24.7538, lon: 67.897640 },
//  { code: "41783", name: "Sajawal", lat: 24.59995, lon: 68.07489 },
  { code: "41785", name: "Badin", lat: 24.6716, lon: 68.83393 },
  { code: "41764", name: "Hyderabad", lat: 25.3766, lon: 68.3626444 },
//  { code: "41764", name: "T.AllahYar", lat: 25.4170, lon: 68.71928 },
//  { code: "41764", name: "T.M.Khan", lat: 25.12866, lon: 68.54376 },
//  { code: "41764", name: "Jamshoro", lat: 25.43375, lon: 68.28053 },
 // { code: "41764", name: "Mitiari", lat: 25.59698, lon: 68.44521 },
  { code: "41743", name: "Dadu", lat: 26.70925, lon: 67.779560 },
  { code: "41767", name: "MirpurKhas", lat: 25.53159, lon: 68.989320 },
  { code: "41768", name: "Chhor", lat: 25.51964, lon: 69.7690326 },
  { code: "41786", name: "Mithi", lat: 24.7469, lon: 69.796030 },
  { code: "41749", name: "Nawabshah", lat: 26.21781, lon: 68.3919538 },
//  { code: "41749", name: "Sanghar", lat: 26.04783, lon: 68.94906 },
//  { code: "41746", name: "NausheroFiroz", lat: 26.84309, lon: 68.12332 },
  { code: "41724", name: "Sukkur", lat: 27.72229, lon: 68.796940 },
  { code: "41725", name: "Rohri", lat: 27.68448, lon: 68.890670 },
  { code: "41726", name: "Khairpur", lat: 27.49389, lon: 68.760970 },
  { code: "41748", name: "Larkana", lat: 25.54062, lon: 68.191740 },
  { code: "41715", name: "Jacobabad", lat: 28.26759, lon: 68.4458756 }
];

// --- Utility Functions ---
function min(arr){ return arr.length ? Math.min(...arr).toFixed(0) : "-"; }
function max(arr){ return arr.length ? Math.max(...arr).toFixed(0) : "-"; }

function getIndices(timeArray, offsetDays){
  const start = offsetDays * 24;
  const end = start + 24;
  const indices = [];
  for(let i=start; i<end && i<timeArray.length; i++) indices.push(i);
  return indices;
}

// --- Synop Parsing ---
function parseSynop(synopText){
  const lines = synopText.split("\n").map(l=>l.trim()).filter(l=>l);
  const stationData = {};
  
  for(const line of lines){
    const parts = line.split(/\s+/); 
    const code = parts[0]; 
    const idx333 = parts.indexOf("333");
    
    if(idx333 === -1) continue;
    
    const after333 = parts.slice(idx333+1);
    let maxTemp=null, minTemp=null, rhVal=null;

    for(const val of after333){
      // Max Temp (Group 1snTxTxTx)
      if(/^1\d{4}$/.test(val)){ 
        let raw = parseInt(val.substring(2));
        let sign = val.charAt(1) === '1' ? -1 : 1;
        maxTemp = (sign * (raw / 10)).toFixed(1);
      } 
      // Min Temp (Group 2snTnTnTn)
      else if(/^2\d{4}$/.test(val)){ 
        let raw = parseInt(val.substring(2));
        let sign = val.charAt(1) === '1' ? -1 : 1;
        minTemp = (sign * (raw / 10)).toFixed(1);
      }
    }
    
    // --- Robust RH Extraction ---
    const fullLine = parts.join(" "); 
    // 1. "RH" followed by digits
    let rhMatch = fullLine.match(/RH\s*[:=\-]?\s*(\d{2,3})/i);
    // 2. Digits before "%"
    if (!rhMatch) {
        rhMatch = fullLine.match(/(\d{2,3})\s*%/);
    }

    if (rhMatch) {
        let r = parseInt(rhMatch[1]);
        if(r <= 100) rhVal = r;
    }

    if(!stationData[code]) stationData[code]={};
    if(maxTemp!==null) stationData[code].maxTemp = maxTemp;
    if(minTemp!==null) stationData[code].minTemp = minTemp;
    if(rhVal!==null) stationData[code].rh = rhVal;
  }
  return stationData;
}

// --- API Fetch ---
async function fetchData(lat, lon){
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,relative_humidity_2m&forecast_days=3&timezone=UTC`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("API Error");
    return await res.json();
  } catch (e) {
    console.error(e);
    return null;
  }
}

// --- Build Table Row ---
function buildRow(point, data, synop){
  let obsTemp = "-";
  let obsRH = "-";

  // 1. Observed Data
  if(synop[point.code]){
    const s = synop[point.code];
    if(s.minTemp && s.maxTemp) obsTemp = `${s.minTemp} / ${s.maxTemp}`;
    else if (s.maxTemp) obsTemp = s.maxTemp;
    else if (s.minTemp) obsTemp = s.minTemp;
    
    if(s.rh) obsRH = s.rh;
  }

  // 2. Forecast Data
  let fctTemps = ["-", "-", "-"];
  let fctRHs = ["-", "-", "-"];

  if(data && data.hourly){
    const t = data.hourly.temperature_2m;
    const r = data.hourly.relative_humidity_2m;
    const time = data.hourly.time;

    for(let d=0; d<3; d++){
      const idx = getIndices(time, d);
      if(idx.length > 0){
        // Format: Min - Max
        fctTemps[d] = `${min(idx.map(i=>t[i]))} - ${max(idx.map(i=>t[i]))}`;
        fctRHs[d] = `${min(idx.map(i=>r[i]))} - ${max(idx.map(i=>r[i]))}`;
      }
    }
  }

  return `
    <tr>
      <td>${point.name}</td>
      <td>${point.code}</td>
      <td class="col-obs">${obsTemp}</td>
      <td>${fctTemps[0]}</td>
      <td>${fctTemps[1]}</td>
      <td>${fctTemps[2]}</td>
      <td class="col-obs">${obsRH}</td>
      <td>${fctRHs[0]}</td>
      <td>${fctRHs[1]}</td>
      <td>${fctRHs[2]}</td>
    </tr>
  `;
}

// --- Main Process ---
async function processSynopAndLoad(){
  const btn = document.getElementById("loadBtn");
  const msg = document.getElementById("statusMsg");
  const tbody = document.getElementById("tableBody");
  
  btn.disabled = true;
  msg.textContent = "Processing...";
  tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; padding:20px;">Fetching Data...</td></tr>`;

  const synopText = document.getElementById("synopBox").value;
  const synopData = parseSynop(synopText);

  // Parallel Fetch
  const fetchPromises = points.map(async (point) => {
    const data = await fetchData(point.lat, point.lon);
    return { point, data };
  });

  const results = await Promise.all(fetchPromises);

  // Render Rows
  tbody.innerHTML = "";
  results.forEach(res => {
    tbody.innerHTML += buildRow(res.point, res.data, synopData);
  });

  msg.textContent = `Completed! Loaded ${results.length} stations.`;
  btn.disabled = false;
}
</script>

</body>
</html>
